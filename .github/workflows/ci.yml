name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:runtime
      - run: npm run check
      - run: node scripts/package-vsix.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: compress-image-${{ matrix.target }}
          path: "*.vsix"
          if-no-files-found: error
